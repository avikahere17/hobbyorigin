<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" width="400" height="80">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#2d1b4e"/>
    </linearGradient>
    <linearGradient id="wordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Icon glow -->
  <circle cx="40" cy="40" r="38" fill="url(#glowGrad)"/>
  <!-- Icon bg -->
  <circle cx="40" cy="40" r="32" fill="url(#iconBg)"/>
  <circle cx="40" cy="40" r="32" fill="none" stroke="url(#brandGrad)" stroke-width="1.2" opacity="0.6"/>

  <!-- Lines -->
  <g opacity="0.4" stroke="url(#brandGrad)" stroke-width="1.4" stroke-linecap="round">
    <line x1="40" y1="40" x2="40" y2="16"/>
    <line x1="40" y1="40" x2="19" y2="52"/>
    <line x1="40" y1="40" x2="61" y2="52"/>
    <line x1="40" y1="40" x2="14" y2="31"/>
    <line x1="40" y1="40" x2="66" y2="31"/>
    <line x1="40" y1="16" x2="19" y2="52"/>
    <line x1="40" y1="16" x2="61" y2="52"/>
    <line x1="19" y1="52" x2="61" y2="52"/>
    <line x1="14" y1="31" x2="19" y2="52"/>
    <line x1="66" y1="31" x2="61" y2="52"/>
    <line x1="14" y1="31" x2="40" y2="16"/>
    <line x1="66" y1="31" x2="40" y2="16"/>
  </g>

  <!-- Outer nodes -->
  <g filter="url(#glow)">
    <circle cx="40" cy="16" r="4.5" fill="#a78bfa"/>
    <circle cx="19" cy="52" r="4.5" fill="#818cf8"/>
    <circle cx="61" cy="52" r="4.5" fill="#c084fc"/>
    <circle cx="14" cy="31" r="3.8" fill="#e879f9"/>
    <circle cx="66" cy="31" r="3.8" fill="#f472b6"/>
  </g>

  <!-- Centre node -->
  <circle cx="40" cy="40" r="9" fill="url(#brandGrad)" filter="url(#softGlow)"/>
  <circle cx="40" cy="40" r="5.5" fill="white" opacity="0.95"/>
  <circle cx="40" cy="40" r="2.8" fill="url(#brandGrad)"/>

  <!-- Wordmark -->
  <text x="88" y="48" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-weight="800" font-size="34" letter-spacing="-1.2"
        fill="white">Hobby<tspan fill="url(#wordGrad)">Origin</tspan></text>
</svg>
