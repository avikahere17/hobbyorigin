<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#2d1b4e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer ambient glow -->
  <circle cx="60" cy="60" r="58" fill="url(#glowGrad)"/>

  <!-- Main icon circle -->
  <circle cx="60" cy="60" r="52" fill="url(#iconBg)"/>
  <circle cx="60" cy="60" r="52" fill="none" stroke="url(#brandGrad)" stroke-width="2" opacity="0.7"/>

  <!-- Connection lines -->
  <g opacity="0.45" stroke="url(#brandGrad)" stroke-width="2" stroke-linecap="round">
    <line x1="60" y1="60" x2="60" y2="24"/>
    <line x1="60" y1="60" x2="30" y2="78"/>
    <line x1="60" y1="60" x2="90" y2="78"/>
    <line x1="60" y1="60" x2="22" y2="48"/>
    <line x1="60" y1="60" x2="98" y2="48"/>
    <line x1="60" y1="24" x2="30" y2="78"/>
    <line x1="60" y1="24" x2="90" y2="78"/>
    <line x1="60" y1="24" x2="22" y2="48"/>
    <line x1="60" y1="24" x2="98" y2="48"/>
    <line x1="30" y1="78" x2="90" y2="78"/>
    <line x1="22" y1="48" x2="30" y2="78"/>
    <line x1="98" y1="48" x2="90" y2="78"/>
    <line x1="22" y1="48" x2="98" y2="48"/>
  </g>

  <!-- Outer nodes -->
  <g filter="url(#glow)">
    <circle cx="60" cy="24" r="7" fill="#a78bfa"/>
    <circle cx="30" cy="78" r="7" fill="#818cf8"/>
    <circle cx="90" cy="78" r="7" fill="#c084fc"/>
    <circle cx="22" cy="48" r="6" fill="#e879f9"/>
    <circle cx="98" cy="48" r="6" fill="#f472b6"/>
  </g>

  <!-- Centre origin node -->
  <circle cx="60" cy="60" r="14" fill="url(#brandGrad)" filter="url(#softGlow)"/>
  <circle cx="60" cy="60" r="9" fill="white" opacity="0.95"/>
  <circle cx="60" cy="60" r="4.5" fill="url(#brandGrad)"/>
</svg>
