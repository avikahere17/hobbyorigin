<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120">
  <defs>
    <!-- Main brand gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <!-- Icon glow -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <!-- Text gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#f9a8d4"/>
    </linearGradient>
    <!-- Icon background gradient -->
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#2d1b4e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background (transparent for overlay use) -->

  <!-- ══════════════ ICON MARK ══════════════ -->
  <!-- Outer glow circle -->
  <circle cx="60" cy="60" r="52" fill="url(#glowGrad)"/>

  <!-- Icon background pill -->
  <circle cx="60" cy="60" r="46" fill="url(#iconBg)" opacity="0.95"/>
  <circle cx="60" cy="60" r="46" fill="none" stroke="url(#brandGrad)" stroke-width="1.5" opacity="0.6"/>

  <!-- Network nodes — 5 connected points forming an origin symbol -->
  <!-- Connection lines (drawn first, behind nodes) -->
  <g opacity="0.5" stroke="url(#brandGrad)" stroke-width="1.8" stroke-linecap="round">
    <!-- Center to top -->
    <line x1="60" y1="60" x2="60" y2="30"/>
    <!-- Center to bottom-left -->
    <line x1="60" y1="60" x2="34" y2="75"/>
    <!-- Center to bottom-right -->
    <line x1="60" y1="60" x2="86" y2="75"/>
    <!-- Top to bottom-left -->
    <line x1="60" y1="30" x2="34" y2="75"/>
    <!-- Top to bottom-right -->
    <line x1="60" y1="30" x2="86" y2="75"/>
    <!-- Bottom-left to bottom-right -->
    <line x1="34" y1="75" x2="86" y2="75"/>
    <!-- Extra: side nodes -->
    <line x1="60" y1="60" x2="28" y2="52"/>
    <line x1="60" y1="60" x2="92" y2="52"/>
    <line x1="28" y1="52" x2="34" y2="75"/>
    <line x1="92" y1="52" x2="86" y2="75"/>
    <line x1="28" y1="52" x2="60" y2="30"/>
    <line x1="92" y1="52" x2="60" y2="30"/>
  </g>

  <!-- Outer nodes (smaller, representing community members) -->
  <g filter="url(#glow)">
    <!-- Top node — kids (playful yellow-purple) -->
    <circle cx="60" cy="30" r="6" fill="#a78bfa"/>
    <!-- Bottom-left node — seniors (calm blue) -->
    <circle cx="34" cy="75" r="6" fill="#818cf8"/>
    <!-- Bottom-right node — adults -->
    <circle cx="86" cy="75" r="6" fill="#c084fc"/>
    <!-- Left node — teens -->
    <circle cx="28" cy="52" r="5" fill="#e879f9"/>
    <!-- Right node — global -->
    <circle cx="92" cy="52" r="5" fill="#f472b6"/>
  </g>

  <!-- Center origin node — the "O" — largest, brightest -->
  <circle cx="60" cy="60" r="10" fill="url(#brandGrad)" filter="url(#softGlow)"/>
  <circle cx="60" cy="60" r="6" fill="white" opacity="0.95"/>
  <circle cx="60" cy="60" r="3" fill="url(#brandGrad)"/>

  <!-- ══════════════ WORDMARK ══════════════ -->
  <!-- "Hobby" — bold white -->
  <text x="126" y="52" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-weight="800" font-size="36" letter-spacing="-1"
        fill="white">Hobby</text>

  <!-- "Origin" — gradient purple-pink -->
  <text x="126" y="90" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-weight="800" font-size="36" letter-spacing="-1"
        fill="url(#textGrad)">Origin</text>

  <!-- Tagline -->
  <text x="128" y="108" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-weight="400" font-size="11" letter-spacing="2.5"
        fill="#8888aa" opacity="0.8">WHERE HOBBIES BUILD COMMUNITIES</text>
</svg>
