name: E2E Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # allows manual trigger from GitHub UI
  schedule:
    - cron: '0 6 * * *'  # nightly at 06:00 UTC

jobs:
  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Wait for Render server to be ready
        run: |
          echo "Checking server availability..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST https://hobbyorigin-server.onrender.com/graphql \
              -H "Content-Type: application/json" \
              -d '{"query":"{ __typename }"}' \
              --max-time 10 || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Server is ready!"
              break
            fi
            sleep 10
          done

      - name: Run E2E tests against production
        working-directory: tests
        env:
          SERVER_URL: https://hobbyorigin-server.onrender.com/graphql
        run: node e2e.test.js

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-log
          path: tests/
          retention-days: 7
